<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="icons/32.png" />

  <body class="help-page">
    <main>
      <header class="page-header">
        <img src="icons/48.png" width="40" height="40" alt="" />
        <span data-i18n="extensionName"></span>
      </header>
      <nav class="page-nav" data-i18n-aria-label="settingsNavigation">
        <a href="options.html" data-i18n="settingsHeading"></a>
        <a href="help.html" aria-current="page" data-i18n="helpHeading"></a>
      </nav>
      <h1 data-i18n="helpHeading"></h1>
      <p class="intro" data-i18n="helpIntro"></p>
      <section class="card help-content">

      <section class="card feedback-card" aria-labelledby="feedback-heading">
        <div>
          <h2 id="feedback-heading" data-i18n="helpFeedback"></h2>
          <p data-i18n="helpFeedbackDescription"></p>

          class="button-link"

          rel="noopener noreferrer"
          data-i18n="helpFeedbackLink"

      </section>
      <footer class="help-footer">
        <p>
          <span data-i18n="helpAuthor"></span>
          <a href="https://github.com/yuzhouu" target="_blank" rel="noopener noreferrer">yuzhou</a>

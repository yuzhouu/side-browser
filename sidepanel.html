<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="extensionName"></title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header data-i18n-aria-label="navigation">
<button id="back" type="button" data-i18n-aria-label="back" data-i18n-title="back" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button>
<button id="forward" type="button" data-i18n-aria-label="forward" data-i18n-title="forward" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M4 12h12"/></svg></button>
<button id="reload" type="button" data-i18n-aria-label="reload" data-i18n-title="reload" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19.5 12a7.5 7.5 0 1 0-2.2 5.3M20 12l-2.7-5.3"/></svg></button>
<form id="navigate"><input id="address" data-i18n-aria-label="address" data-i18n-placeholder="address" autocomplete="off" spellcheck="false" enterkeyhint="go"><button id="recent" type="button" popovertarget="recent-menu" data-i18n-aria-label="recentOpened" data-i18n-title="recentOpened"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></button></form>
<button id="current" type="button" data-i18n-title="openCurrentTitle" data-i18n="openCurrent"></button>
<button id="more" type="button" popovertarget="more-menu" data-i18n-aria-label="more" data-i18n-title="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</header>
<div id="recent-menu" popover role="group" aria-labelledby="recent-heading">
<div class="recent-heading"><span id="recent-heading" data-i18n="recentOpened"></span><button id="clear-recent" type="button" data-i18n="clearRecent" disabled></button></div>
<ul id="recent-list"></ul>
<p id="recent-empty" data-i18n="recentEmpty"></p>
</div>
<div id="more-menu" popover role="group" data-i18n-aria-label="more">
<button id="external" type="button" data-i18n-title="openExternalTitle" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M10 4H4v16h16v-6"/></svg><span data-i18n="openExternal"></span></button>
<button id="mode" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span id="mode-label"></span></button>
</div>
<div id="notice" role="status" hidden><span></span><button id="retry" type="button" data-i18n="retry" hidden></button></div>
<main><div id="viewport"><iframe id="web" data-i18n-title="frameTitle" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div id="empty"><strong data-i18n="emptyTitle"></strong><span data-i18n="emptyDescription"></span></div></main>
<script type="module" src="sidepanel.js"></script></body></html>

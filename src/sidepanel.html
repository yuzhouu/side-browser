<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="theme.css" />
    <script type="module" src="theme.ts"></script>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header data-i18n-aria-label="navigation">
      <button
        id="current"
        type="button"
        data-i18n-aria-label="openCurrentTitle"
        data-i18n-title="openCurrentTitle"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M15 4v16M7 8l4 4-4 4" />
        </svg>
      </button>
      <span class="toolbar-separator" aria-hidden="true"></span>
      <button id="back" type="button" data-i18n-aria-label="back" data-i18n-title="back" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12" /></svg>
      </button>
      <button
        id="forward"
        type="button"
        data-i18n-aria-label="forward"
        data-i18n-title="forward"
        disabled
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6M4 12h12" /></svg>
      </button>
      <button
        id="reload"
        type="button"
        data-i18n-aria-label="reload"
        data-i18n-title="reload"
        disabled
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5M19.5 12a7.5 7.5 0 1 0-2.2 5.3M20 12l-2.7-5.3" />
        </svg>
      </button>
      <form id="navigate">
        <input
          id="address"
          data-i18n-aria-label="address"
          data-i18n-placeholder="address"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="go"
        /><button
          id="recent"
          type="button"
          popovertarget="recent-menu"
          data-i18n-aria-label="recentOpened"
          data-i18n-title="recentOpened"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 7v5l3 2" />
          </svg>
        </button>
      </form>
      <button
        id="more"
        type="button"
        popovertarget="more-menu"
        data-i18n-aria-label="more"
        data-i18n-title="more"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1" />
          <circle cx="12" cy="12" r="1" />
          <circle cx="19" cy="12" r="1" />
        </svg>
      </button>
    </header>
    <div id="recent-menu" popover role="group" aria-labelledby="recent-heading">
      <div class="recent-heading">
        <span id="recent-heading" data-i18n="recentOpened"></span
        ><button id="clear-recent" type="button" data-i18n="clearRecent" disabled></button>
      </div>
      <ul id="recent-list"></ul>
      <p id="recent-empty" data-i18n="recentEmpty"></p>
    </div>
    <template id="recent-item-template">
      <li class="recent-item">
        <button class="recent-open" type="button">
          <span class="recent-icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="4" ry="9" />
              <path d="M3 12h18" /></svg
            ><img width="16" height="16" alt="" hidden /></span
          ><span class="recent-text"
            ><span class="recent-label"></span><span class="recent-url"></span
          ></span>
        </button>
        <button class="recent-remove" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
        </button>
      </li>
    </template>
    <div id="more-menu" popover role="group" data-i18n-aria-label="more">
      <button id="external" type="button" data-i18n-title="openExternalTitle" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6M20 4 10 14M10 4H4v16h16v-6" /></svg
        ><span data-i18n="openExternal"></span>
      </button>
      <button id="mode" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M8 21h8M12 17v4" /></svg
        ><span id="mode-label"></span>
      </button>
      <div class="theme-options" role="group" aria-labelledby="theme-heading">
        <div id="theme-heading" data-i18n="settingsTheme"></div>
        <button type="button" data-theme-value="system" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M8 21h8M12 17v4" /></svg
          ><span data-i18n="themeSystem"></span>
        </button>
        <button type="button" data-theme-value="light" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"
            /></svg
          ><span data-i18n="themeLight"></span>
        </button>
        <button type="button" data-theme-value="dark" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 13A8.5 8.5 0 0 1 11 3.5a8.5 8.5 0 1 0 9.5 9.5Z" /></svg
          ><span data-i18n="themeDark"></span>
        </button>
      </div>
      <button id="settings" type="button" data-i18n-title="settingsHeading">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 17h16" />
          <circle cx="9" cy="7" r="2" />
          <circle cx="15" cy="17" r="2" /></svg
        ><span data-i18n="settingsHeading"></span>
      </button>
      <button id="help" type="button" data-i18n-title="helpHeading">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6M12 7v1" /></svg
        ><span data-i18n="helpHeading"></span>
      </button>
    </div>
    <div id="notice" role="status" hidden>
      <span></span><button id="retry" type="button" data-i18n="retry" hidden></button>
    </div>
    <main>
      <div id="viewport">
        <iframe
          id="web"
          data-i18n-title="frameTitle"
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals allow-pointer-lock allow-presentation"
          allow="clipboard-write; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <section id="empty" aria-labelledby="empty-title">
        <div class="empty-content">
          <img class="empty-logo" src="/icons/128.png" width="48" height="48" alt="" />
          <h1 id="empty-title" data-i18n="emptyTitle"></h1>
          <p class="empty-description" data-i18n="emptyDescription"></p>
          <div class="empty-actions">
            <button id="empty-current" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M15 4v16M7 8l4 4-4 4" />
              </svg>
              <span data-i18n="openCurrent"></span>
            </button>
            <button id="empty-address" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 5 5" />
              </svg>
              <span data-i18n="emptySearch"></span>
            </button>
          </div>
          <ul class="empty-tips">
            <li>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M15 4v16M3 9h12" />
              </svg>
              <span data-i18n="emptyKeepHint"></span>
            </li>
            <li>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="2" width="12" height="20" rx="2" />
                <path d="M10 18h4" />
              </svg>
              <span data-i18n="emptyModeHint"></span>
            </li>
          </ul>
          <a href="help.html" target="_blank" rel="noopener" data-i18n="emptyHelp"></a>
        </div>
      </section>
    </main>
    <script type="module" src="sidepanel.ts"></script>
  </body>
</html>
